<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldmart Favicon Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .preview-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            margin: 20px;
        }
        .favicon-preview {
            margin: 20px 0;
        }
        .size-label {
            color: #333;
            font-weight: bold;
            margin: 10px 0;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .sizes {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .size-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <h1>🌟 Goldmart Favicon Preview 🌟</h1>
        <p style="color: #666;">Your new gold and diamond themed favicon</p>
        
        <div class="sizes">
            <div class="size-box">
                <div class="size-label">16x16 (Browser Tab)</div>
                <img src="/favicon.svg" width="16" height="16" alt="Favicon 16x16" style="border: 1px solid #ddd; margin: 10px 0;">
            </div>
            <div class="size-box">
                <div class="size-label">32x32 (Standard)</div>
                <img src="/favicon.svg" width="32" height="32" alt="Favicon 32x32" style="border: 1px solid #ddd; margin: 10px 0;">
            </div>
            <div class="size-box">
                <div class="size-label">64x64 (Large)</div>
                <img src="/favicon.svg" width="64" height="64" alt="Favicon 64x64" style="border: 1px solid #ddd; margin: 10px 0;">
            </div>
            <div class="size-box">
                <div class="size-label">128x128 (Preview)</div>
                <img src="/favicon.svg" width="128" height="128" alt="Favicon 128x128" style="border: 1px solid #ddd; margin: 10px 0;">
            </div>
            <div class="size-box">
                <div class="size-label">256x256 (Full Size)</div>
                <img src="/favicon.svg" width="256" height="256" alt="Favicon 256x256" style="border: 1px solid #ddd; margin: 10px 0;">
            </div>
        </div>
        
        <div style="margin-top: 40px; padding: 20px; background: #fff3cd; border-radius: 10px;">
            <p style="color: #856404; margin: 0;">
                <strong>Design Features:</strong><br>
                ✨ Gold gradient background<br>
                💎 Diamond shape with shine effects<br>
                🔤 Letter "G" for Goldmart<br>
                ✨ Sparkle effects for elegance
            </p>
        </div>
    </div>
</body>
</html>
